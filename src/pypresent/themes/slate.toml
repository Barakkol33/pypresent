# slate: quiet, cool and typographic - a flat rule, square bullets, a little
# more air between them.  For a talk that is mostly prose.
base = "warm"

accent = "#334155"
accent2 = "#0f766e"
ink = "#1e293b"
muted = "#64748b"
line = "#e2e8f0"
canvas = "#ffffff"
backdrop = "#dfe5ec"
soft = "#eef2f7"
inline_ink = "#0f766e"
code_bg = "#0f172a"
code_fg = "#e2e8f0"
out_bg = "#f1f5f9"
out_fg = "#334155"
row_alt = "#f6f8fb"
head_fg = "#ffffff"

font = "\"Inter\", \"Segoe UI\", Helvetica, Arial, system-ui, sans-serif"
title_weight = "600"
cover_title_weight = "600"
title_tracking = "-.02em"
bullet_glyph = "\"\\25AA\""
bullet_gap = "2.8cqh"
radius = ".4cqh"
frame_shadow = "0 .6cqh 2cqh rgba(15,23,42,.12)"
stage_shadow = "0 0 30px rgba(15,23,42,.14)"
