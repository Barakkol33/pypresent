[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pypresent"
dynamic = ["version"]
description = "Slides from a Jupyter notebook, quoting its code and output, as one self-contained HTML file."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Barak Kolnik", email = "barakkol@gmail.com" }]
keywords = ["jupyter", "notebook", "slides", "presentation", "html", "markdown", "reveal"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Framework :: Jupyter",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics :: Presentation",
  "Topic :: Text Processing :: Markup :: HTML",
  "Typing :: Typed",
]
dependencies = [
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Only executing a notebook needs Jupyter; rendering a stored one does not.
jupyter = ["nbformat>=5.9", "nbclient>=0.9", "nbconvert>=7.0", "ipykernel>=6.0"]
yaml = ["PyYAML>=6.0"]
dev = [
  "pypresent[jupyter,yaml]",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "build>=1.2",
]

[project.scripts]
pypresent = "pypresent.cli:main"

[project.urls]
Homepage = "https://github.com/Barakkol33/pypresent"
Documentation = "https://github.com/Barakkol33/pypresent/blob/main/docs/README.md"
Source = "https://github.com/Barakkol33/pypresent"
Issues = "https://github.com/Barakkol33/pypresent/issues"
Changelog = "https://github.com/Barakkol33/pypresent/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/pypresent/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pypresent"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["pypresent"]

[tool.ruff]
line-length = 96
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  "E741",    # `l` reads fine as a level counter
  "RUF001",  # the Hebrew and typographic characters are deliberate
  "RUF002",
  "RUF003",
  "B905",    # zip(...) without strict= is fine on paired lists we built
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
