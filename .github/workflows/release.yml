# Publishing happens on a version tag and on nothing else.
#
# Pushing to main never publishes.  A release is:
#
#     # set the version in src/pypresent/__init__.py, and CHANGELOG.md
#     git commit -am "0.1.0"
#     git tag v0.1.0 && git push origin main --tags
#
# The tag has to match the version in the package, or the job stops before it
# uploads anything.  It goes to TestPyPI first, and only then to PyPI.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      test_only:
        description: "Publish to TestPyPI only"
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: The tag and the package have to agree
        id: version
        run: |
          version=$(grep -oP '__version__ = "\K[^"]+' src/pypresent/__init__.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "package says $version"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            echo "tag says $tag"
            [ "$tag" = "$version" ] || {
              echo "::error::tag v$tag does not match __version__ $version"; exit 1; }
          fi

      - run: pip install -e ".[dev]" build twine
      - run: ruff check .
      - run: pytest -q
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pypresent
    permissions:
      id-token: write          # trusted publishing: no token stored anywhere
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi:
    needs: [build, testpypi]
    # a tag publishes for real; a manual run only does if you say so
    if: github.event_name == 'push' || inputs.test_only == false
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pypresent
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
