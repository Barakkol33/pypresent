version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # one PR a month for the dev tools; they move together and none of them
      # ships to anyone
      dev:
        patterns: ["pytest*", "ruff", "build", "twine"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
